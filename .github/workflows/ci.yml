# Checks on every push / pull request: frontend type-check + build, backend tests and lints on
# Linux, macOS and Windows.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Debug output on every run. RUST_BACKTRACE/cargo/npm/tauri verbosity work from here; GitHub's
  # own ACTIONS_STEP_DEBUG / ACTIONS_RUNNER_DEBUG are only guaranteed when set as repository
  # variables (Settings -> Secrets and variables -> Actions -> Variables), so set them there too.
  ACTIONS_STEP_DEBUG: "true"
  ACTIONS_RUNNER_DEBUG: "true"
  RUST_BACKTRACE: full
  CARGO_TERM_VERBOSE: "true"
  NPM_CONFIG_LOGLEVEL: verbose

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gurl/package-lock.json
      - run: npm ci
        working-directory: gurl
      - run: npm run check
        working-directory: gurl
      - run: npm run build -- --debug
        working-directory: gurl

  backend:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gurl
          key: ${{ matrix.platform }}

      - name: install linux system deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libcurl4-openssl-dev libxml2-dev libclang-dev

      - name: install macOS deps
        if: startsWith(matrix.platform, 'macos')
        run: |
          # libcurl and libxml2 come from the macOS SDK (they ship with the OS, so nothing to install
          # for users). OpenSSL is only a build-time need of curl-sys: link Homebrew's static archives
          # so the app doesn't depend on Homebrew at runtime.
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "LIBXML2=$(xcrun --show-sdk-path)/usr/lib/libxml2.tbd" >> "$GITHUB_ENV"

      - name: install windows deps (vcpkg)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libxml2:x64-windows-static-md openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # tauri::generate_context! needs the frontend dist directory to exist.
      - name: stub frontend dist
        shell: bash
        run: mkdir -p gurl/dist && touch gurl/dist/index.html

      - name: test
        run: cargo test --workspace -- --nocapture
        working-directory: gurl

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: gurl
