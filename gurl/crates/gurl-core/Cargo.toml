[package]
name = "gurl-core"
version.workspace = true
# Edition 2024 so that sources from the vendored hurl crate (edition 2024) can be `#[path]`-included.
edition = "2024"
description = "gURL engine: HURL model, workspaces, runs and reports (no GUI)"

[lib]
# The forked hurl CLI has doc comments with non-Rust code blocks (they never ran as doctests in
# hurl's binary crate either).
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hurl.workspace = true
hurl_core.workspace = true
# `gurl cli` (forked hurl CLI) and `gurl --version`
clap = { version = "4", features = ["string", "wrap_help"] }
glob = "0.3"
regex = "1"
terminal_size = "0.4"
curl-sys = "0.4"
libxml = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
