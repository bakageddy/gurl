<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3b"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="neon" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#glow)"/>
  <!-- soft green edge, like a terminal glowing at the border -->
  <rect x="122" y="122" width="780" height="780" rx="166" fill="none" stroke="#3fb950" stroke-opacity="0.55" stroke-width="8" filter="url(#neon)"/>
  <rect x="122" y="122" width="780" height="780" rx="166" fill="none" stroke="#3fb950" stroke-opacity="0.8" stroke-width="3"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="186.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <g fill="none" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- small g -->
    <g stroke="#3fb950">
      <circle cx="246" cy="540" r="55"/>
      <path d="M301 485 V613 A42 42 0 0 1 259 655 H243"/>
    </g>
    <!-- URL -->
    <g stroke="#f0f6fc">
      <path d="M365 395 V535 A60 60 0 0 0 485 535 V395"/>
      <path d="M549 595 V395 H619 A50 50 0 0 1 619 495 H549 M600 495 L669 595"/>
      <path d="M733 395 V595 H833"/>
    </g>
  </g>
</svg>
